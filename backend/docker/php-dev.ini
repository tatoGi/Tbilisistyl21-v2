; Dev performance tuning for `php artisan serve` (CLI SAPI).
; The built-in dev server keeps the process alive, so enabling OPcache here
; removes the per-request "re-parse every PHP file" cost that made the
; Filament admin take 5-9s per page.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
; Keep timestamp validation on for dev (so code edits are picked up), but only
; re-check files every couple of seconds instead of on every single request.
opcache.validate_timestamps=1
opcache.revalidate_freq=2

; Huge win on Windows/WSL2 bind mounts: cache resolved paths so the autoloader
; does not stat the whole vendor/ tree on every request.
realpath_cache_size=8M
realpath_cache_ttl=600

; Light JIT to shave CPU off request handling.
opcache.jit=tracing
opcache.jit_buffer_size=64M

memory_limit=512M

; Media uploads: Filament allows images up to 5 MB (maxSize 5120), so PHP's
; 2M/8M defaults silently rejected them and tickets saved without an image.
upload_max_filesize=10M
post_max_size=25M
