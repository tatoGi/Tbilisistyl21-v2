upstream laravel {
    server laravel:8000;
}

upstream nextjs {
    server nextjs:3000;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_orders:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_personal:10m rate=5r/m;

# HTTP — ACME webroot + redirect to HTTPS
server {
    listen 80;
    server_name tbilisistyle.com www.tbilisistyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Local dev / direct IP access (no TLS)
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/conf.d/security-headers.inc;

    include /etc/nginx/conf.d/app-locations.inc;
}
