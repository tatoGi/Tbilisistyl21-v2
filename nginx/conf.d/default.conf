upstream laravel {
    server laravel:8000;
}

upstream nextjs {
    server nextjs:3000;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_orders:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_personal:10m rate=5r/m;

# HTTP → HTTPS + ACME webroot (all public hostnames)
server {
    listen 80;
    server_name tbilisistyle.com www.tbilisistyle.com new.tbilisistyle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Active TLS — staging cert (works for new.tbilisistyle.com today)
server {
    listen 443 ssl;
    http2 on;
    server_name new.tbilisistyle.com;

    ssl_certificate /etc/letsencrypt/live/new.tbilisistyle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.tbilisistyle.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/app-locations.inc;
}

# Local dev / direct IP access (no TLS)
server {
    listen 80 default_server;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/app-locations.inc;
}
